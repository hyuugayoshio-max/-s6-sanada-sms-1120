<!DOCTYPE html>
<!--
【焼肉の女】3話 S6A「えつ宅」劇用スマホ（えつ）SNS画面　検索 → MÉLA投稿 → #Rinya → Rinya投稿
撮影用・単一HTMLファイル（外部読み込みなし）
  ・スマホ：画面いっぱい（ホーム画面に追加して全画面表示）
  ・PC：390×844の比率で画面中央に表示
  ・すべての寸法は 画面幅÷390 を1単位として拡大縮小
操作
  ・検索画面：キーボード／検索欄を1回触るごとに1文字（R→i→n→y→a）
              打ち終わったら「検索」キー（どこを触っても可）→ MÉLAの投稿が開く
  ・MÉLAの投稿：指で上下スクロール。「#Rinya」をタップ → Rinyaの投稿が開く
  ・Rinyaの投稿：写真を指で横スワイプ → ワンショット
  ・戻るボタン：1つ前の画面へ／長押し（0.8秒）で最初（検索の入力前）に戻る
  ・投稿画面の上の「投稿」の文字をタップでステータスバーの表示／非表示
  ・PC：キーボードの 1＝検索／2＝MÉLA投稿／3＝Rinya投稿　G＝合成枠グリーン切替　R＝最初から
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SNS</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SNS">
<meta name="application-name" content="SNS">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#1c1c1e;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:none;-webkit-font-smoothing:antialiased}
body.touch{background:#fff}
:root{--text:#000;--sub:#737373;--link:#1d3f73;--line:#dbdbdb;--blue:#2f7cf6;--chip:#efefef;--ring:linear-gradient(45deg,#36d1c4,#3b8cff 55%,#7b5cff)}
/* 画面：設計は幅390px。JSで画面幅に合わせて拡大縮小 */
#phone{position:absolute;left:0;top:0;width:390px;height:844px;background:#fff;overflow:hidden;transform-origin:0 0;color:var(--text);--st:47px;--sb:0px}
#probe{position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}

/* ステータスバー（時刻なし。右上＝電波・4G・電池） */
#status{position:absolute;top:0;left:0;right:0;height:var(--st);z-index:50;background:#fff;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 26px 10px}
#status .r{display:flex;gap:6px;align-items:center}
#status .net{font-size:15.5px;font-weight:600;letter-spacing:-.2px}
#status.hide>*{visibility:hidden}

/* 画面切替 */
.scr{position:absolute;top:var(--st);left:0;width:390px;bottom:0;background:#fff;overflow:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),box-shadow .32s;will-change:transform}
.scr.off{transform:translateX(390px)}
.scr.under{transform:translateX(-110px)}
.scr.moving{box-shadow:-8px 0 20px rgba(0,0,0,.12)}
.noanim .scr{transition:none!important}

/* 検索画面 */
#sSearch{display:flex;flex-direction:column}
.sbar{flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 14px}
.sbox{flex:1;height:36px;border-radius:10px;background:var(--chip);display:flex;align-items:center;gap:8px;padding:0 11px;font-size:16px}
.sbox .typed{color:#000}
.sbox .ph0{color:#8e8e8e}
.sbox .caret{width:2px;height:19px;background:var(--blue);margin:0 1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sbar .cancel{font-size:16px}
.recent{flex:1;padding:6px 16px 0}
.recent h4{font-size:16px;font-weight:700;margin:6px 0 10px;display:flex;justify-content:space-between}
.recent h4 span{font-size:14px;font-weight:600;color:var(--blue)}
.ritem{display:flex;align-items:center;gap:12px;height:60px}
.ritem .ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.ritem .t{flex:1;font-size:14px;line-height:1.3}
.ritem .t span{color:var(--sub)}
.ritem .x{color:#8e8e8e;font-size:20px;line-height:1}
/* キーボード（汎用） */
#kb{flex:none;background:#d1d4da;padding:6px 3px calc(var(--sb) * .7 + 4px)}
.krow{display:flex;justify-content:center;gap:6px;margin-bottom:11px}
.k{height:43px;flex:0 0 32px;border-radius:6px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;font-size:22px;color:#000;transition:background .08s}
.k.f{background:#abb0ba;font-size:15px}
.k.pressed{background:#8d929c}
.k.f.pressed{background:#7e838d}
.k svg{width:22px;height:22px;fill:none;stroke:#000;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.krow.r2{padding:0 18px}
.k.shift,.k.del{flex:0 0 42px}
.k.n123{flex:0 0 46px}
.k.globe{flex:0 0 42px}
.k.space{flex:1 1 auto}
.k.go{flex:0 0 92px;font-size:15px}
.k.go.on{background:var(--blue);color:#fff}
.krow:last-child{margin-bottom:6px}

/* 投稿 */
.nav{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#fff;position:relative;z-index:5}
.nav .title{position:absolute;left:90px;right:90px;text-align:center;font-weight:700;font-size:16px;line-height:1.15}
.nav .title small{display:block;font-weight:600;font-size:11.5px;color:var(--sub);line-height:1.1;margin-bottom:1px}
.nav .back{width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.nav .back.down{background:rgba(0,0,0,.06)}
.pscroll{position:absolute;top:44px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none}
.pscroll::-webkit-scrollbar{display:none}
.phead{height:54px;display:flex;align-items:center;padding:0 12px;gap:10px}
.phead .av{width:34px;height:34px;border-radius:50%;padding:2px;background:var(--ring);flex:none}
.phead .av>div{width:100%;height:100%;border-radius:50%;border:2px solid #fff;overflow:hidden}
.phead .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px;flex:1}
.verified{display:inline-block;width:13px;height:13px;flex:none}
.media{width:390px;height:488px;position:relative;overflow:hidden;background:#000}
.track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{width:390px;height:100%;flex:none;position:relative;scroll-snap-align:start;scroll-snap-stop:always}
.counter{position:absolute;top:14px;right:14px;background:rgba(18,18,18,.7);color:#fff;font-size:12px;font-weight:500;padding:4px 9px;border-radius:13px;z-index:3;letter-spacing:.5px;pointer-events:none}
.mute{position:absolute;right:12px;bottom:12px;width:28px;height:28px;border-radius:50%;background:rgba(18,18,18,.7);display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none}
.actions{height:46px;display:flex;align-items:center;padding:0 12px;position:relative}
.actions .l{display:flex;gap:16px;align-items:center}
.actions .dots{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:4px;pointer-events:none}
.actions .dots i{width:6px;height:6px;border-radius:50%;background:#a8a8a8;display:block}
.actions .dots i.on{background:var(--blue);transform:scale(1.15)}
.actions .save{margin-left:auto}
.ptext{padding:0 14px;font-size:14px;line-height:1.45}
.ptext .likes{font-weight:600;margin-bottom:5px}
.ptext b{font-weight:600}
.ptext .cap,.ptext .cm .tx{white-space:pre-wrap;word-break:normal;line-break:strict;overflow-wrap:anywhere}
.ptext a{color:var(--link);text-decoration:none;border-radius:3px}
.ptext a.tag{position:relative;padding:2px 0}
.ptext a.tag:after{content:"";position:absolute;inset:-10px -8px}   /* 押しやすく */
.ptext a.hi{background:rgba(29,63,115,.16)}
.ptext .more{color:var(--sub);margin-top:6px}
.ptext .cm{margin-top:4px;display:flex;gap:6px;align-items:flex-start}
.ptext .cm .tx{flex:1}
.ptext .cm .hrt{margin-top:3px}
.ptext .when{color:var(--sub);font-size:12px;margin-top:8px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(49px + max(var(--sb),8px));background:#fff;border-top:.5px solid var(--line);z-index:6;display:flex;justify-content:space-around;padding-top:11px}
.pscroll .pad{height:calc(110px + var(--sb))}
#homeind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#000;z-index:60;pointer-events:none}
body.touch #homeind{display:none}

/* 合成枠 */
.ph{width:100%;height:100%;position:relative;overflow:hidden;background:repeating-linear-gradient(135deg,#e9e9ec 0 14px,#e2e2e6 14px 28px);display:flex;align-items:center;justify-content:center;text-align:center}
.ph span{font-size:13px;font-weight:600;color:#6e6e73;padding:6px 8px;line-height:1.35;background:rgba(255,255,255,.75);border-radius:6px;max-width:88%}
.ph.small span{display:none}
.ph.dark{background:repeating-linear-gradient(135deg,#2a2a2e 0 14px,#323236 14px 28px)}
.ph.dark span{background:rgba(0,0,0,.5);color:#ddd}
body.green .ph{background:#00ff00!important}
body.green .ph span{display:none}
.fill{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ptext .cap{font-size:15px;line-height:1.6;letter-spacing:.01em}
.ptext .cap b{margin-right:2px}
.phead .nm small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:1px}
</style>
</head>

  ver:'<svg class="verified" viewBox="0 0 24 24"><path fill="#2f7cf6" d="M12 1.5l2.6 1.9 3.2-.2 1 3 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3-3.2-.2L12 22.5l-2.6-1.9-3.2.2-1-3-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3 3.2.2Z"/><path d="M7.6 12.3l3 3 5.8-6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  mute:'<svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9l5 6M21 9l-5 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
  bell:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 1.8H4.4ZM10 20.5a2 2 0 0 0 4 0"/></svg>',
  addp:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="8" r="4"/><path d="M2.5 20.5c.8-3.8 3.8-6 7.5-6s6.7 2.2 7.5 6M19 7v6M16 10h6"/></svg>',
  grid:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9"><rect x="3" y="3" width="18" height="18"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>',
  reels:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 9.2v5.6l4.6-2.8Z" fill="#8e8e8e"/></svg>',
  tagged:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.9" stroke-linejoin="round"><path d="M9 4H4v15h5l3 3 3-3h5V4h-5"/><circle cx="12" cy="9.5" r="2.5"/><path d="M7.5 17c.7-2.3 2.4-3.5 4.5-3.5s3.8 1.2 4.5 3.5"/></svg>',
  multi:'<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" style="filter:drop-shadow(0 0 1.5px rgba(0,0,0,.5))"><path d="M8 3h11a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M4 7v12a2 2 0 0 0 2 2h12" fill="none" stroke="#fff" stroke-width="2"/></svg>',
  reel:'<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" style="filter:drop-shadow(0 0 1.5px rgba(0,0,0,.5))"><path d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm4 6.2v5.6l4.6-2.8Z" fill-rule="evenodd"/></svg>',
  // tab bar（汎用アイコン）
  tHome:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7V20.5h-5.5v-6h-6v6H3.5Z"/></svg>',
  tSearch:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg>',
  tAdd:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>',
  tReel:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 8h18M8.5 3l3 5M14.5 3l3 5"/><path d="M10.2 11.5v5l4.3-2.5Z" fill="#000"/></svg>',
  sig:'<svg width="18" height="12" viewBox="0 0 18 12" fill="#000"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>',
  wifi:'<svg width="17" height="12" viewBox="0 0 17 12" fill="#000"><path d="M8.5 2.3c2.5 0 4.8 1 6.5 2.6l1.3-1.3A11 11 0 0 0 8.5.4 11 11 0 0 0 .7 3.6L2 4.9a9.2 9.2 0 0 1 6.5-2.6Zm0 3.6c1.5 0 2.9.6 4 1.6l1.3-1.3a7.6 7.6 0 0 0-10.6 0l1.3 1.3c1.1-1 2.5-1.6 4-1.6Zm0 3.5c-.6 0-1.2.2-1.6.6L8.5 11.6l1.6-1.6c-.4-.4-1-.6-1.6-.6Z"/></svg>',
  bat:'<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="#000" opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2.4" fill="#000"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="#000" opacity=".45"/></svg>',
};
I.srch='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg>';
I.srchL='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg>';
I.hash='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M9 3 7 21M17 3l-2 18M4 8.5h17M3 15.5h17"/></svg>';
I.shift='<svg viewBox="0 0 24 24"><path d="M12 4 4 12.5h4.5V20h7v-7.5H20Z"/></svg>';
I.del='<svg viewBox="0 0 24 24"><path d="M8.5 5H20a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 20 19H8.5L2.5 12z"/><path d="m11 9 6 6M17 9l-6 6"/></svg>';
I.globe='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/></svg>';

function ph(key, extra){
  const d = CFG.img[key];
  if (d && d[0]){
    if (d[2]==='video') return `<video class="fill" src="${esc(d[0])}" muted playsinline loop autoplay preload="auto"></video>`;
    return `<img class="fill" src="${esc(d[0])}">`;
  }
  return `<div class="ph ${extra||''}"><span>${esc(d?d[1]:key).replace(/\n/g,'<br>')}</span></div>`;
}
function richText(s){
  return esc(fillVars(s)).replace(/(@[\w.]+)/g,'<a>$1</a>')
    .replace(/(#[^\s#]+)/g, m => `<a class="${m.toLowerCase()==='#'+CFG.searchWord.toLowerCase()?'tag':''}">${m}</a>`);
}

/* ---- 組み立て ---- */
$('stIcons').innerHTML = `${I.sig}<span class="net">${esc(CFG.network)}</span>${I.bat}`;
const tabbar = `<div class="tabbar">${I.tHome}${I.tSearch}${I.tAdd}${I.tReel}<div style="width:28px;height:28px;border-radius:50%;background:#d8d8dc;border:1.5px solid #fff;box-shadow:0 0 0 1px #000"></div></div>`;

const KROWS = ['qwertyuiop','asdfghjkl','zxcvbnm'];
$('sSearch').innerHTML = `
  <div class="sbar"><div class="sbox" id="sbox">${I.srch}<span class="typed" id="typed"></span><span class="caret"></span><span class="ph0" id="ph0">検索</span></div><div class="cancel">キャンセル</div></div>
  <div class="recent">${CFG.recent.length?`<h4>最近の検索<span>すべて見る</span></h4>`:''}${CFG.recent.map(([n,s])=>`<div class="ritem"><div class="ic">${n[0]==='#'?I.hash:I.srchL}</div><div class="t">${esc(n)}<br><span>${esc(s)}</span></div><div class="x">×</div></div>`).join('')}</div>
  <div id="kb">
    <div class="krow">${[...KROWS[0]].map(c=>`<div class="k" data-k="${c}">${c}</div>`).join('')}</div>
    <div class="krow r2">${[...KROWS[1]].map(c=>`<div class="k" data-k="${c}">${c}</div>`).join('')}</div>
    <div class="krow"><div class="k f shift" data-k="shift">${I.shift}</div>${[...KROWS[2]].map(c=>`<div class="k" data-k="${c}">${c}</div>`).join('')}<div class="k f del" data-k="del">${I.del}</div></div>
    <div class="krow"><div class="k f n123">123</div><div class="k f globe">${I.globe}</div><div class="k space">space</div><div class="k f go" id="go">検索</div></div>
  </div>`;

function buildPost(el, o){
  const n = o.slides.length;
  el.innerHTML = `
  <div class="nav"><div class="back" data-back>${I.back}</div><div class="title" data-stt><small>${esc(o.id)}</small>投稿</div><div></div></div>
  <div class="pscroll">
    <div class="phead"><div class="av"><div>${ph(o.av,'small')}</div></div>
      <div class="nm"><div><div style="display:flex;align-items:center;gap:4px">${esc(o.id)}${o.verified?I.ver:''}</div>${o.sub?`<small>${esc(o.sub)}</small>`:''}</div></div>${I.more}</div>
    <div class="media">
      ${n>1?`<div class="counter">1/${n}</div>`:''}${o.video?`<div class="mute">${I.mute}</div>`:''}
      <div class="track">${o.slides.map(k=>`<div class="slide">${ph(k, CFG.img[k][2]==='video'?'dark':'')}</div>`).join('')}</div>
    </div>
    <div class="actions"><div class="l">${I.heart}${I.cmt}${I.share}</div>
      ${n>1?`<div class="dots">${o.slides.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}<div class="save">${I.save}</div></div>
    <div class="ptext">
      <div class="likes">「いいね！」${esc(o.likes)}件</div>
      <div class="cap"><b>${esc(o.id)}</b> ${richText(o.caption)}</div>
      <div class="more">コメント${esc(o.comments)}件をすべて見る</div>
      ${o.cmts.map(([u,t])=>`<div class="cm"><div class="tx"><b>${esc(fillVars(u))}</b> ${richText(t)}</div><div class="hrt">${I.heartS}</div></div>`).join('')}
      <div class="when">${esc(o.when)}</div>
    </div>
    <div class="pad"></div>
  </div>${tabbar}`;
  const tr = el.querySelector('.track');
  if (n>1) tr.addEventListener('scroll', () => {
    const idx = Math.round(tr.scrollLeft/390);
    el.querySelector('.counter').textContent = `${idx+1}/${n}`;
    el.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on', i===idx));
  }, {passive:true});
}
const M = CFG.mela, R = CFG.rinya;
buildPost($('sPost1'), {id:M.id, verified:M.verified, sub:'MÉLA（メラ）オフィシャル', av:'melaAvatar', slides:['practiceVideo'], video:true, likes:M.likes, comments:M.comments, when:M.when, caption:M.caption, cmts:M.comments_list});
buildPost($('sPost2'), {id:R.id, verified:R.verified, sub:`Rinya・フォロワー${R.followers}人`, av:'rinyaAvatar', slides:['rinyaDance','rinyaSmile'], video:false, likes:R.likes, comments:R.comments, when:R.when, caption:R.caption, cmts:R.comments_list});

/* ---- 画面の状態 ---- */
const SCR = [$('sSearch'), $('sPost1'), $('sPost2')];
let cur = 0, typed = 0;
function show(n, anim){
  if (!anim) phone.classList.add('noanim');
  SCR.forEach((s,i) => {
    s.classList.toggle('off', i>n); s.classList.toggle('under', i<n);
    s.classList.remove('moving');
  });
  if (anim && SCR[n]) { const s = SCR[Math.max(n, cur)]; s.classList.add('moving'); setTimeout(()=>s.classList.remove('moving'), 340); }
  cur = n;
  if (!anim) { void phone.offsetWidth; phone.classList.remove('noanim'); }
}
function renderSearch(){
  const w = CFG.searchWord.slice(0, typed);
  $('typed').textContent = w; $('ph0').style.display = typed ? 'none' : '';
  $('go').classList.toggle('on', typed >= CFG.searchWord.length);
}
function resetAll(){
  typed = 0; renderSearch();
  SCR.forEach(s => { const p = s.querySelector('.pscroll'); if (p) p.scrollTop = 0; const t = s.querySelector('.track'); if (t) { t.scrollLeft = 0; t.dispatchEvent(new Event('scroll')); } });
  show(0, false);
}
function goTo(n){   // PC確認用：その画面の頭へ
  typed = n>0 ? CFG.searchWord.length : 0; renderSearch(); show(n, false);
}

/* ---- 操作 ---- */
function flash(el){ if(!el) return; el.classList.add('pressed'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('pressed'), 140); }
const keyEl = k => document.querySelector(`#kb .k[data-k="${k}"]`);
function typeNext(){
  if (cur !== 0) return;
  if (typed < CFG.searchWord.length){
    flash(keyEl(CFG.searchWord[typed].toLowerCase()) || keyEl('shift'));
    typed++; renderSearch(); return;
  }
  flash($('go')); setTimeout(()=>show(1, true), 120);        // 打ち終わったら次の1タップで検索
}
// 検索画面：どこを触っても1文字（削除キーは1文字戻す）
$('sSearch').addEventListener('pointerdown', e => {
  e.preventDefault();
  const k = e.target.closest('.k');
  if (k && k.dataset.k === 'del'){ flash(k); if (typed>0){ typed--; renderSearch(); } return; }
  typeNext();
});
// 「#Rinya」タップ（スクロール中の指は除く）
let tp = null;
$('sPost1').addEventListener('pointerdown', e => { tp = {x:e.clientX, y:e.clientY, t:Date.now(), tag:e.target.closest('a.tag')}; });
$('sPost1').addEventListener('pointerup', e => {
  if (!tp) return; const ok = tp.tag && Math.hypot(e.clientX-tp.x, e.clientY-tp.y) < 12 && Date.now()-tp.t < 700; const a = tp.tag; tp = null;
  if (ok){ a.classList.add('hi'); setTimeout(()=>{ show(2, true); setTimeout(()=>a.classList.remove('hi'), 400); }, 160); }
});
// 戻る：タップで1つ前／長押し0.8秒で最初に戻る
document.querySelectorAll('[data-back]').forEach(b => {
  let lp = null, long = false;
  b.addEventListener('pointerdown', e => { e.stopPropagation(); long = false; b.classList.add('down'); lp = setTimeout(()=>{ long = true; b.classList.remove('down'); resetAll(); }, 800); });
  b.addEventListener('pointerup', () => { b.classList.remove('down'); clearTimeout(lp); if (!long && cur>0) show(cur-1, true); });
  ['pointerleave','pointercancel'].forEach(t => b.addEventListener(t, () => { b.classList.remove('down'); clearTimeout(lp); }));
});
// 「投稿」の文字タップでステータスバー表示／非表示
document.querySelectorAll('[data-stt]').forEach(t => t.addEventListener('pointerdown', e => { e.preventDefault(); $('status').classList.toggle('hide'); }));
// PC確認用
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k==='1'||k==='2'||k==='3') goTo(+k-1);
  else if (k==='g') document.body.classList.toggle('green');
  else if (k==='r') resetAll();
  else if (k===' ' && cur===0){ e.preventDefault(); typeNext(); }
});

/* ---- 撮影事故防止 ---- */
const nope = e => e.preventDefault();
['gesturestart','gesturechange','gestureend','dblclick','selectstart','contextmenu','dragstart'].forEach(t => document.addEventListener(t, nope, {passive:false}));
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || !e.target.closest('.pscroll,.track')) e.preventDefault(); }, {passive:false});
document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, {passive:false});

/* ---- サイズ（画面幅÷390で拡大縮小） ---- */
function layout(){
  const iw = window.innerWidth, ih = window.innerHeight;
  let U, Hd, left = 0, top = 0;
  if (touch){
    U = iw / 390; Hd = ih / U;
    const pr = getComputedStyle($('probe'));
    const st = parseFloat(pr.paddingTop)||0, sb = parseFloat(pr.paddingBottom)||0;
    phone.style.setProperty('--st', Math.max(47, st/U + 3) + 'px');
    phone.style.setProperty('--sb', (sb/U) + 'px');
  } else {
    U = Math.min((iw-20)/390, (ih-20)/844); Hd = 844;
    left = (iw - 390*U)/2; top = (ih - 844*U)/2;
    phone.style.setProperty('--st','47px'); phone.style.setProperty('--sb','26px');
  }
  phone.style.height = Hd + 'px';
  phone.style.transform = `translate(${left}px,${top}px) scale(${U})`;
}
renderSearch(); show(0, false);
layout();
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 300));
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
window.addEventListener('pageshow', layout);
[100, 400, 1000].forEach(ms => setTimeout(layout, ms));
})();
</script>
</body>
</html>
